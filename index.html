<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Power Monitor</h1>
            <div class="theme-toggle">
                <button id="themeToggle" class="theme-btn">
                    <span class="light-icon">☀️</span>
                    <span class="dark-icon">🌙</span>
                </button>
            </div>
        </header>

        <main>
            <!-- Left Panel - Device Configuration -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2>Device Configuration</h2>
                </div>
                
                <div class="connection-section">
                    <div class="status-indicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-text" id="statusText">Disconnected</span>
                    </div>
                    
                    <div class="connection-controls">
                        <button id="connectBtn" class="btn btn-primary">Connect</button>
                        <button id="disconnectBtn" class="btn btn-secondary" disabled>Disconnect</button>
                    </div>
                    
                    <div class="device-info" id="deviceInfo">
                        <p>No device connected</p>
                    </div>
                </div>

                <div class="data-info">
                    <h3>Data Format</h3>
                    <p>The device sends JSON data in the format:</p>
                    <pre>{"cS":[{"ch":0,"v_mV":1234,"c_mA":123,"p_mW":12345,"ts":1234567890}]}</pre>
                </div>
            </div>

            <!-- Right Panel - Charts -->
            <div class="right-panel">
                <div class="charts-container">
                    <div class="chart-section">
                        <h3>Voltage (mV)</h3>
                        <canvas id="voltageChart"></canvas>
                    </div>
                    
                    <div class="chart-section">
                        <h3>Current (mA)</h3>
                        <canvas id="currentChart"></canvas>
                    </div>
                    
                    <div class="chart-section">
                        <h3>Power (mW)</h3>
                        <canvas id="powerChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <!-- Console Panel -->
        <div class="console-panel">
            <div class="console-header">
                <h3>Debug Console</h3>
                <button id="consoleToggle" class="btn btn-small">Show/Hide</button>
            </div>
            <div class="console-content" id="consoleContent">
                <div class="console-messages" id="consoleMessages"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
